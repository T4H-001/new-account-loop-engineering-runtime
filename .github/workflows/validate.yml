name: Static Runtime Validation

on:
  workflow_dispatch:
  pull_request:
  push:
    paths:
      - 'src/**'
      - 'schemas/**'
      - '.github/workflows/**'

jobs:
  static-validation:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate required files exist
        run: |
          test -f LOOP_ENGINEERING_101.md
          test -f schemas/receipt.schema.json
          test -f src/loop-runner.mjs
          test -f src/validate-receipts.mjs
          test -f .github/workflows/runtime.yml
          echo "STATIC_VALIDATION_OK"
