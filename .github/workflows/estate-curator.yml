# Qualification lineage: TML-4PM/runtime-real PR 94 @ 223d19edc0a7e2c470e7c9292fc1bf88908af27d
name: Estate Intelligence Curator

on:
  workflow_dispatch:
  pull_request:
    paths:
      - ".github/workflows/estate-curator.yml"
      - "governanceos/**"
      - "runtime/executor/estate_curator.py"
      - "runtime/registry/worker_state.json"
      - "tests/**"
      - "workers/estate-intelligence-curator/**"
  push:
    paths:
      - ".github/workflows/estate-curator.yml"
      - "governanceos/**"
      - "runtime/executor/estate_curator.py"
      - "runtime/registry/worker_state.json"
      - "tests/**"
      - "workers/estate-intelligence-curator/**"

permissions:
  contents: read

jobs:
  qualify-three-distinct-sources:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run complete test suite
        run: python3 -m unittest discover -s tests -v
      - name: Execute three distinct governed sources
        run: |
          set -euo pipefail
          sources=(
            "tests/fixtures/estate-curator-thread.txt"
            "tests/fixtures/unseen-thread-pr96.txt"
            "tests/fixtures/tax-audit-estate-thread.txt"
          )
          index=0
          for source in "${sources[@]}"; do
            index=$((index + 1))
            run_id="github-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-source-${index}"
            python3 runtime/executor/estate_curator.py \
              --root . \
              --input "${source}" \
              --run-id "${run_id}" \
              | tee "estate-curator-receipt-${index}.json"
          done
      - name: Verify three receipts, ledgers and telemetry
        run: |
          set -euo pipefail
          for index in 1 2 3; do
            run_id="github-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-source-${index}"
            python3 -m json.tool "estate-curator-receipt-${index}.json" >/dev/null
            test -s "runtime/evidence/receipts/${run_id}.json"
            test -s "runtime/evidence/telemetry/${run_id}.json"
            test -s "runtime/graph/runs/${run_id}/objects.json"
            test -s "runtime/graph/runs/${run_id}/relationships.json"
            grep -q '"classification": "REAL"' "estate-curator-receipt-${index}.json"
            grep -q '"promotion_state": "PENDING_HUMAN_REVIEW"' "estate-curator-receipt-${index}.json"
          done
          grep -q '"state": "VERIFIED"' runtime/registry/worker_state.json
          python3 -c 'import json; d=json.load(open("runtime/registry/worker_state.json")); r=d["workers"]["wk-estate-curator-001"]["successful_distinct_runs"]; assert len(r) >= 3, r'
      - name: Run ten known-thread benchmark
        run: |
          set -euo pipefail
          mkdir -p runtime/qualification/known-benchmark
          passed=0
          for source in tests/fixtures/estate-curator-benchmark/*.txt; do
            case_name="$(basename "${source}" .txt)"
            run_id="benchmark-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-${case_name}"
            python3 runtime/executor/estate_curator.py \
              --root . \
              --input "${source}" \
              --run-id "${run_id}" \
              > "runtime/qualification/known-benchmark/${case_name}-receipt.json"
            grep -q '"classification": "REAL"' "runtime/qualification/known-benchmark/${case_name}-receipt.json"
            passed=$((passed + 1))
          done
          test "${passed}" -eq 10
          printf '{"benchmark":"known-thread","passed":%s,"total":10,"status":"PASS"}\n' "${passed}" > runtime/qualification/known-benchmark/summary.json
      - name: Independently review unseen-thread execution
        run: |
          set -euo pipefail
          unseen_id="github-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-source-2"
          python3 runtime/review/unseen_review.py \
            --receipt "runtime/evidence/receipts/${unseen_id}.json" \
            --telemetry "runtime/evidence/telemetry/${unseen_id}.json" \
            --objects "runtime/graph/runs/${unseen_id}/objects.json" \
            --relationships "runtime/graph/runs/${unseen_id}/relationships.json" \
            --output runtime/qualification/unseen-review.json
          grep -q '"outcome": "PASS"' runtime/qualification/unseen-review.json
          grep -q '"promotion_effect": "NONE"' runtime/qualification/unseen-review.json
      - name: Promote qualified worker to ACTIVE
        run: |
          set -euo pipefail
          promotion_id="promotion-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          python3 runtime/promotion/promote_estate_curator.py \
            --root . \
            --run-id "${promotion_id}" \
            --approved-by "T4H001" \
            | tee estate-curator-promotion-receipt.json
          grep -q '"to_state": "ACTIVE"' estate-curator-promotion-receipt.json
          grep -q '"state": "ACTIVE"' runtime/registry/worker_state.json
          test -s "runtime/evidence/promotions/${promotion_id}.json"
          test -s "runtime/evidence/telemetry/${promotion_id}-promotion.json"
      - uses: actions/upload-artifact@v4
        with:
          name: estate-curator-three-source-${{ github.run_id }}-${{ github.run_attempt }}
          if-no-files-found: error
          retention-days: 30
          path: |
            estate-curator-receipt-*.json
            estate-curator-promotion-receipt.json
            runtime/evidence/promotions/
            governanceos/review-queue/
            runtime/evidence/receipts/
            runtime/evidence/telemetry/
            runtime/graph/runs/
            runtime/registry/worker_state.json
            runtime/qualification/
